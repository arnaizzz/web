<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function prepareSessionPreloader() {
        var root = document.documentElement;
        var storageKey = "miguel-arnaiz-preloader-seen";
        var shouldShow = false;

        try {
          shouldShow = window.sessionStorage.getItem(storageKey) !== "1";
          if (shouldShow) {
            window.sessionStorage.setItem(storageKey, "1");
          }
        } catch (storageError) {
          var cookieMarker = storageKey + "=1";

          try {
            shouldShow = document.cookie.split("; ").indexOf(cookieMarker) === -1;
            if (shouldShow) {
              document.cookie = cookieMarker + "; Path=/; SameSite=Lax";
            }
          } catch (cookieError) {
            shouldShow = true;
          }
        }

        if (!shouldShow) {
          return;
        }

        root.classList.add("has-session-preloader");
        window.__portfolioPreloaderStartedAt = Date.now();
        window.__portfolioPreloaderSafetyTimer = window.setTimeout(function () {
          var preloader = document.querySelector("[data-session-preloader]");
          var body = document.body;

          root.classList.remove("has-session-preloader");
          if (preloader) {
            preloader.remove();
          }
          if (body) {
            body.classList.remove("is-entering", "is-leaving");
          }
        }, 2500);
      })();
    </script>
    <title data-i18n="meta.project.title">Miguel Arnáiz - Proyecto</title>
    <meta name="description" content="Proyecto del portfolio profesional de Miguel Arnáiz." data-project-description />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="img/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=20261103b" />
  </head>

  <body class="page project-page is-entering">
    <div class="session-preloader" data-session-preloader aria-hidden="true">
      <div class="session-preloader-content">
        <img
          class="session-preloader-logo"
          src="img/arnaiz-preloader.png"
          width="480"
          height="116"
          alt=""
          decoding="sync"
          fetchpriority="high"
        />
        <span class="session-preloader-track"><span></span></span>
      </div>
    </div>

    <div class="bg-orbs" aria-hidden="true">
      <span class="orb orb-blue"></span>

    </div>

    <header class="site-header shell">

            <a class="top-nav-link" href="about.html" data-transition data-i18n="nav.about">Sobre mí</a>
          </div>
          <div class="language-switcher" role="group" aria-label="Seleccionar idioma" data-i18n-aria-label="language.selector">
            <button class="language-option" type="button" data-language="es" lang="es" aria-pressed="true">ES</button>
            <span class="language-divider" aria-hidden="true">|</span>
            <button class="language-option" type="button" data-language="en" lang="en" aria-pressed="false">EN</button>
          </div>
        </div>
      </nav>

    </header>

    <main class="shell project-main" data-project-detail aria-busy="true">
      <p
        class="project-fallback"
        data-project-render-error
        data-i18n="project.renderError"
        role="alert"
        hidden
      >No se ha podido cargar este proyecto. Prueba a recargar la página.</p>
      <noscript>
        <p class="project-fallback" role="alert">Activa JavaScript para ver este proyecto.</p>
      </noscript>
    </main>

    <script>
      window.setTimeout(function () {
        var projectMain = document.querySelector("[data-project-detail]");
        var renderError = projectMain && projectMain.querySelector("[data-project-render-error]");

        if (projectMain && projectMain.getAttribute("aria-busy") === "true" && renderError) {
          projectMain.setAttribute("aria-busy", "false");
          renderError.hidden = false;
          document.body.classList.remove("is-entering", "is-leaving");
        }
      }, 4000);
    </script>

              <a href="files/Miguel-Arnaiz-CV-EN.pdf" download="Miguel-Arnaiz-CV-English.pdf" data-i18n="cv.english">CV English</a>

    <script src="js/reveal.js" defer></script>
